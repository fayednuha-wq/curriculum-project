            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .app-header {
            background: #2c3e50;

            padding: 18px;

            border-radius: 6px;
            margin-bottom: 10px;
        }

        .academic-info span {
            color: #63b3ed;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            background: rgba(255,255,255,0.2);
            height: 7px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            height: 100%;
            background: #e67e22;
            width: 8.3%;
            transition: width 0.4s ease;
        }

        .step-indicator {
            font-size: 0.78rem;
            opacity: 0.85;
        }

        .sim-card {
            padding: 22px;
        }

        .scenario-box {
            background: #f8f9fa;
            border-right: 4px solid #3498db;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .question-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: #2c3e50;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e2e8f0;
            padding: 11px 14px;
            border-radius: 8px;
            text-align: right;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: #3498db;
            background: #f1f8ff;
        }

        .remedial-box {
            background: #fff5f5;
            border: 2px dashed #e53e3e;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .remedial-box h3 {
            color: #c53030;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .remedial-box p {
            font-size: 0.9rem;
            margin-bottom: 14px;
            color: #4a5568;
            line-height: 1.6;
            text-align: right;
        }

        .action-btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: #2b6cb0;
        }
    </style>
</head>

                    { text: "الاقتصار على الاختبار التحريري النهائي الورقي", correct: false, remedialId: "rem12" },

        const remedialContent = {
            rem1: { title: "💡 مسار علاجي: مفهوم التطوير", text: "تطوير المنهج ليس تجميلاً شكلياً (أغلفة أو روابط عابرة)، بل هو عملية شاملة وممنهجة تمس الأهداف، المحتوى، الأنشطة، وطرائق التقويم بانسجام تام.", backStep: 1 },

            rem5: { title: "💡 مسار علاجي: الأساس الاجتماعي", text: "المنهج المطور يجب أن يتفاعل بحيوية مع قضايا المجتمع المحلي ومشكلاته ليكون ذا معنى حقيقي للمتعلم.", backStep: 5 },

            rem11: { title: "💡 مسار علاجي: مواجهة المعوقات", text: "مقاومة التغيير تُعالج بالاحتواء، والتطوير المهني المستمر، وإقناع الميدان التربوي بجدوى التغيير ومكتسباته.", backStep: 11 },
            rem12: { title: "💡 مسار علاجي: التقويم الشامل", text: "التقويم الفعال لا يقتصر على ورقة واختبار نهائي، بل يعتمد على تنوع الأدوات والمهام الأدائية والمشروعات التطبيقية الحية.", backStep: 12 }
        };

        let currentStepIndex = 0;

        function renderSimulation() {
            const container = document.getElementById('simContent');
            const progressFill = document.getElementById('progressFill');
            const stepIndicator = document.getElementById('stepIndicator');
            
            const step = simulationData[currentStepIndex];
            
            progressFill.style.width = step.progress;
            stepIndicator.textContent = step.stepText;

            let html = `
                <div class="scenario-box">
                    <strong>📋 سيناريو المحاكاة:</strong><br>${step.scenario}
                </div>
                <div class="question-title">${step.question}</div>
                <div class="options-group">
            `;

            step.options.forEach((opt) => {
                html += `<button class="option-btn" onclick="handleAnswer(${opt.correct}, ${opt.next ? (typeof opt.next === 'string' ? `'${opt.next}'` : opt.next) : 'null'}, '${opt.remedialId || ''}')">${opt.text}</button>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function handleAnswer(isCorrect, nextStep, remedialId) {
            if (isCorrect) {
                if (nextStep === 'finish') {
                    showCompletionScreen();
                } else {
                    currentStepIndex = nextStep - 1;
                    renderSimulation();
                }
            } else {
                showRemedialScreen(remedialId);
            }
        }

        function showRemedialScreen(remId) {
            const container = document.getElementById('simContent');
            const rem = remedialContent[remId];

            container.innerHTML = `
                <div class="remedial-box">
                    <h3>${rem.title}</h3>
                    <p>${rem.text}</p>
                    <button class="action-btn" onclick="retryStep(${rem.backStep})">فهمت، العودة للمحاولة مجدداً 🔄</button>
                </div>
            `;
        }

        function retryStep(stepNum) {
            currentStepIndex = stepNum - 1;
            renderSimulation();
        }

        function showCompletionScreen() {
            const container = document.getElementById('simContent');
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('stepIndicator').textContent = 'اكتملت المحاكاة بنجاح تام 🎉';

            container.innerHTML = `
                <div class="remedial-box" style="border-color: #38a169; background: #f0fff4;">
                    <h3 style="color: #276749;">🎉 مبارك يا نهى! أتممتِ المحاكاة بامتياز تام!</h3>
                    <p style="text-align: center;">لقد غطيتِ كافة المحاور والأسس الستة وعمليات التطوير وفق معايير د. خلود آل الشيخ بدقة تامة لتستحقي الدرجة الكاملة.</p>
                    <button class="action-btn" style="background: #38a169;" onclick="restartSim()">إعادة المحاكاة من البداية 🔄</button>
                </div>
            `;
        }

        function restartSim() {
            currentStepIndex = 0;
            renderSimulation();
        }

        window.onload = renderSimulation;
    </script>
</body>
</html>
