        let currentStepIndex = 0;

        function renderSimulation() {
            const container = document.getElementById('simContent');
            const progressFill = document.getElementById('progressFill');
            const stepIndicator = document.getElementById('stepIndicator');
            
            const step = simulationData[currentStepIndex];
            
            progressFill.style.width = step.progress;
            stepIndicator.textContent = step.stepText;

            let html = `
                <div class="scenario-box">
                    <strong>📋 سيناريو المحاكاة:</strong><br>${step.scenario}
                </div>
                <div class="question-title">${step.question}</div>
                <div class="options-group">
            `;

            step.options.forEach((opt) => {
                html += `<button class="option-btn" onclick="handleAnswer(${opt.correct}, ${opt.next ? (typeof opt.next === 'string' ? `'${opt.next}'` : opt.next) : 'null'}, '${opt.remedialId || ''}')">${opt.text}</button>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function handleAnswer(isCorrect, nextStep, remedialId) {
            if (isCorrect) {
                if (nextStep === 'finish') {
                    showCompletionScreen();
                } else {
                    currentStepIndex = nextStep - 1;
                    renderSimulation();
                }
            } else {
                showRemedialScreen(remedialId);
            }
        }

        function showRemedialScreen(remId) {
            const container = document.getElementById('simContent');
            const rem = remedialContent[remId];

            container.innerHTML = `
                <div class="remedial-box">
                    <h3>${rem.title}</h3>
                    <div class="critical-reflection">
                        <strong>قف مع ذاتك لحظة تحليل ونقد:</strong><br>${rem.reflection}
                    </div>
                    <p><strong>الإضاءة العلمية البديلة:</strong><br>${rem.text}</p>
                    <button class="action-btn" onclick="retryStep(${rem.backStep})">استوعبت التحليل، العودة للمحاولة بإدراك أعمق 🔄</button>
                </div>
            `;
        }

        function retryStep(stepNum) {
            currentStepIndex = stepNum - 1;
            renderSimulation();
        }

        function showCompletionScreen() {
            const container = document.getElementById('simContent');
            document.getElementById('progressFill').style.width = '100vw';
            document.getElementById('stepIndicator').textContent = 'اكتملت المحاكاة النقدية بنجاح تام 🎉';

            container.innerHTML = `
                <div class="remedial-box" style="border-color: #38a169; background: #f0fff4; text-align: center;">
                    <h3 style="color: #276749;">🎉 مبارك يا نهى! أتممتِ المحاكاة برؤية نقدية وعميقة!</h3>
                    <p style="text-align: center; color: #2d3748;">لقد تجاوزتِ مستوى التلقين السطحي إلى تحليل ونقد الأسس التربوية وهندسة المناهج باحترافية تامة تؤهلك للتميز بجدارة.</p>
                    <button class="action-btn" style="background: #38a169;" onclick="restartSim()">إعادة المحاكاة من البداية 🔄</button>
                </div>
            `;
        }

        function restartSim() {
            currentStepIndex = 0;
            renderSimulation();
        }

        window.onload = renderSimulation;
    </script>
