        let currentStepIndex = 0;

        function renderSimulation() {
            const container = document.getElementById('simContent');
            const progressFill = document.getElementById('progressFill');
            const stepIndicator = document.getElementById('stepIndicator');
            
            const step = simulationData[currentStepIndex];
            
            progressFill.style.width = step.progress;
            stepIndicator.textContent = step.stepText;

            let html = `
                <div class="scenario-box">
                    <strong>📋 سيناريو المحاكاة وهندسة المنهج:</strong><br>${step.scenario}
                </div>
                <div class="question-title">${step.question}</div>
                <div class="options-group">
            `;

            step.options.forEach((opt) => {
                html += `<button class="option-btn" onclick="handleAnswer(${opt.correct}, ${opt.next ? (typeof opt.next === 'string' ? `'${opt.next}'` : opt.next) : 'null'}, '${opt.remedialId || ''}')">${opt.text}</button>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function handleAnswer(isCorrect, nextStep, remedialId) {
            if (isCorrect) {
                if (nextStep === 'finish') {
                    showCompletionScreen();
                } else {
                    currentStepIndex = nextStep - 1;
                    renderSimulation();
                }
            } else {
                showRemedialScreen(remedialId);
            }
        }

        function showRemedialScreen(remId) {
            const container = document.getElementById('simContent');
            const rem = remedialContent[remId];

            container.innerHTML = `
                <div class="remedial-box">
                    <h3>${rem.title}</h3>
                    <div class="critical-reflection">
                        <strong>قف مع ذاتك لحظة تحليل ونقد:</strong><br>${rem.reflection}
                    </div>
                    <p><strong>الإضاءة العلمية وتصحيح المسار:</strong><br>${rem.text}</p>
                    <button class="action-btn" onclick="retryStep(${stepBackFromRemedial(remId)})">استوعبت الخلل المعرفي، العودة للمحاولة برؤية أعمق 🔄</button>
                </div>
            `;
        }

        function stepBackFromRemedial(remId) {
            // استخراج رقم المحطة من معرف المسار العلاجي
            if (remId.startsWith("rem1")) return 1;
            if (remId.startsWith("rem2")) return 2;
            if (remId.startsWith("rem3")) return 3;
            if (remId.startsWith("rem4")) return 4;
            if (remId.startsWith("rem5")) return 5;
            if (remId.startsWith("rem6")) return 6;
            if (remId.startsWith("rem7")) return 7;
            if (remId.startsWith("rem8")) return 8;
            if (remId.startsWith("rem9")) return 9;
            if (remId.startsWith("rem10")) return 10;
            if (remId.startsWith("rem11")) return 11;
            if (remId.startsWith("rem12")) return 12;
            return 1;
        }

        function showCompletionScreen() {
            const container = document.getElementById('simContent');
            document.getElementById('progressFill').style.width = '100vw';
            document.getElementById('stepIndicator').textContent = 'اكتملت المحاكاة التطورية بنجاح تام 🎉';

            container.innerHTML = `
                <div class="remedial-box" style="border-color: #38a169; background: #f0fff4; text-align: center;">
                    <h3 style="color: #276749;">🎉 مبارك يا نهى! اجتزتِ محاكاة التطوير والبناء باقتدار!</h3>
                    <p style="text-align: center; color: #2d3748;">لقد أثبتِ فهماً استثنائياً لعمليات هندسة المناهج، وتفريد التعليم، والنظرية البنائية، متجاوزة حدود الحفظ النظري إلى آفاق التفكير النقدي وتصميم الخبرات الحية.</p>
                    <button class="action-btn" style="background: #38a169;" onclick="restartSim()">إعادة المحاكاة من البداية 🔄</button>
                </div>
            `;
        }

        function restartSim() {
            currentStepIndex = 0;
            renderSimulation();
        }

        window.onload = renderSimulation;
    </script>
