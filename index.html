<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة أسس بناء وتطوير المنهج | تقنيات وتصميم التعليم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .app-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #3498db;
        }

        .app-header h1 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .academic-info {
            font-size: 0.82rem;
            color: #cbd5e0;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .academic-info span {
            color: #63b3ed;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            background: rgba(255,255,255,0.2);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            height: 100%;
            background: #e67e22;
            width: 16.6%;
            transition: width 0.4s ease;
        }

        .step-indicator {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        .sim-card {
            padding: 25px;
        }

        .scenario-box {
            background: #f8f9fa;
            border-right: 4px solid #3498db;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: right;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: #3498db;
            background: #f1f8ff;
        }

        .remedial-box {
            background: #fff5f5;
            border: 2px dashed #e53e3e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .remedial-box h3 {
            color: #c53030;
            margin-bottom: 10px;
        }

        .remedial-box p {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #4a5568;
            line-height: 1.6;
            text-align: right;
        }

        .action-btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1>محاكاة أسس بناء وتطوير المنهج 🎓</h1>
            <div class="academic-info">
                إعداد الطالبة: <span>نهى فايد</span> | 
                قسم: <span>تقنيات وتصميم التعليم</span><br>
                إشراف عضو هيئة التدريس: <span>د. آل الشيخ</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 16.6%;"></div>
            </div>
            <span id="stepIndicator" class="step-indicator">المحطة 1 من 6</span>
        </header>

        <main class="sim-card">
            <div id="simContent">
                <!-- المحتوى الديناميكي يظهر هنا -->
            </div>
        </main>
    </div>

    <script>
        const simulationData = [
            {
                id: 1,
                progress: "16.6%",
                stepText: "المحطة 1 من 6: مفهوم تطوير المنهج الشامل",
                scenario: "طلبتِ من فريق التصميم إجراء تطوير شامل لمقرر دراسي قديم عبر الاكتفاء برفع ملفات PDF حديثة وإضافة فيديوهات في المنصة دون المساس بالأهداف أو طرق التقويم.",
                question: "كيف تقييمين هذا الإجراء وفقاً لمفهوم تطوير المنهج الصحيح؟",
                options: [
                    { text: "تطوير صحيح وناجح لأن التقنية حلت محل الكتب الورقية", correct: false, remedialId: "rem1" },
                    { text: "تطوير ناقص؛ لأن التطوير الشامل يجب أن يمس الأهداف، المحتوى، الأنشطة، والتقويم معاً", correct: true, next: 2 },
                    { text: "تطوير يقتصر على تعديل الأساس المعرفي فقط دون غيره", correct: false, remedialId: "rem1" }
                ]
            },
            {
                id: 2,
                progress: "33.2%",
                stepText: "المحطة 2 من 6: الأساس الفلسفي والاتساق",
                scenario: "مقرر دراسي يضع في مقدمة أهدافه 'تنمية التفكير النقدي وحل المشكلات لدى الطالبات'، لكن أسئلة الاختبارات والتقويم تقتصر تماماً على الحفظ والتسميع الحرفي.",
                question: "ما هو الخلل التربوي البارز هنا؟",
                options: [
                    { text: "غياب الاتساق بين الأهداف المعلنة وأساليب التقويم الفعلية (الأساس الفلسفي)", correct: true, next: 3 },
                    { text: "وجود قصور في الأساس الاجتماعي وتجاهل مشكلات المجتمع", correct: false, remedialId: "rem2" },
                    { text: "عدم مراعاة الفروق الفردية بين الطالبات", correct: false, remedialId: "rem2" }
                ]
            },
            {
                id: 3,
                progress: "49.8%",
                stepText: "المحطة 3 من 6: الأساس النفسي والفروق الفردية",
                scenario: "قامت المعلمة بتقديم شرح موحد وأنشطة نمطية متطابقة لكل طالبات الصف في نفس الوقت وبنفس السرعة دون اعتبار لتباين قدراتهن وأنماطهن.",
                question: "ما هو الأساس الذي تم الإخلال به في هذا الموقف؟",
                options: [
                    { text: "الأساس المعرفي لتنظيم المحتوى الهرمي", correct: false, remedialId: "rem3" },
                    { text: "الأساس النفسي؛ لأن تقارب الأعمار لا يعني تماثل القدرات والاستعدادات", correct: true, next: 4 },
                    { text: "الأساس الديني المتعلق بالقيم والأخلاق", correct: false, remedialId: "rem3" }
                ]
            },
            {
                id: 4,
                progress: "66.4%",
                stepText: "المحطة 4 من 6: الأساس الاجتماعي والثقافي",
                scenario: "تصميم محتوى تعليمي منفصل تماماً عن البيئة المحلية، ويطرح قضايا ومفاهيم لا تخص واقع المجتمع السعودي ولا تتناسب مع هويته وقيمه.",
                question: "ما التعديل المطلوب لضمان سلامة المنهج؟",
                options: [
                    { text: "التركيز على الأساس الاجتماعي والثقافي والديني لربط المنهج بالواقع وحفظ الهوية", correct: true, next: 5 },
                    { text: "إلغاء المحتوى النظرية والتركيز على الترفيه الرقمي", correct: false, remedialId: "rem4" },
                    { text: "زيادة حجم المعلومات وحفظها عن ظهر قلب", correct: false, remedialId: "rem4" }
                ]
            },
            {
                id: 5,
                progress: "83%",
                stepText: "المحطة 5 من 6: توظيف التقنية في المنهج (أداة، وسيلة، موضوع)",
                scenario: "أردتِ دمج التقنية في تصميم المنهج بحيث لا تقتصر على كونها عرضاً للشاشة، بل تُستخدم لتمكين الطالبات من محاكاة تجارب علمية معقدة بأنفسهن.",
                question: "كيف تصنفين دور التقنية في هذه الحالة؟",
                options: [
                    { text: "التقنية كـ أداة للتعلم وموضوع ووسيلة لتنفيذ الأنشطة الاستقصائية", correct: true, next: 6 },
                    { text: "التقنية وسيلة ترفيهية جانبية غير مرتبطة بالمناهج", correct: false, remedialId: "rem5" },
                    { text: "التقنية بديل كامل عن المعلم والأهداف التربوية", correct: false, remedialId: "rem5" }
                ]
            },
            {
                id: 6,
                progress: "100%",
                stepText: "المحطة 6 من 6: التقويم الشامل وتصحيح المسار",
                scenario: "بعد بناء المنهج وتطويره بناءً على الأسس الستة، أردتِ التأكد من فاعليته وجودته بشكل حقيقي.",
                question: "ما هي الطريقة الأصح للتقويم الشامل؟",
                options: [
                    { text: "الاقتصار على الاختبار التحريري النهائي الفصلي", correct: false, remedialId: "rem6" },
                    { text: "استخدام أدوات متنوعة: مهام أدائية، مشروعات تفاعلية، ملاحظة ومتابعة مستمرة", correct: true, next: "finish" },
                    { text: "أخذ آراء الطالبات بدون أدوات قياس علمية", correct: false, remedialId: "rem6" }
                ]
            }
        ];

        const remedialContent = {
            rem1: {
                title: "💡 مسار علاجي: مفهوم تطوير المنهج",
                text: "تذكري دائماً: تطوير المنهج ليس مجرد تحديث شكلي أو رقمي (كرفع ملفات أو فيديوهات)، بل هو عملية شاملة وتطويرية تمس عناصر المنهج بأكملها: الأهداف، المحتوى، طرائق التدريس، والتقويم.",
                backStep: 1
            },
            rem2: {
                title: "💡 مسار علاجي: الأساس الفلسفي والاتساق",
                text: "الأساس الفلسفي يربط بين غايات المنهج وممارساته. الخلل يظهر عندما توجد فجوة (عدم اتساق) بين أهداف تدعو للتفكير والتحليل، وواقع تقويمي يحصر الطالبات في التلقين والحفظ.",
                backStep: 2
            },
            rem3: {
                title: "💡 مسار علاجي: الأساس النفسي",
                text: "قاعدة الأساس النفسي الجوهرية هي أن 'تقارب الأعمار لا يعني تماثل القدرات'. لذلك تتطلب المناهج الحديثة مراعاة الفروق الفردية وتبني استراتيجيات التعليم المتمايز.",
                backStep: 3
            },
            rem4: {
                title: "💡 مسار علاجي: الأساس الاجتماعي والثقافي والديني",
                text: "المنهج الناجح لا ينعزل عن مجتمعه؛ بل يستمد قيمه من الدين الحنيف، ويحفظ الهوية الثقافية، ويسهم في معالجة مشكلات المجتمع وتلبية تطلعاته.",
                backStep: 4
            },
            rem5: {
                title: "💡 مسار علاجي: دور التقنية في المنهج",
                text: "في تقنيات التعليم، لا ننظر للتقنية لمجرد العرض، بل بوصفها أداة تدعم الاستقصاء، ووسيلة لتنفيذ الأنشطة، وموضوعاً يتعلمه الطالب ليوظفه بفاعلية واقتدار.",
                backStep: 5
            },
            rem6: {
                title: "💡 مسار علاجي: أدوات التقويم الشامل",
                text: "التقويم الحقيقي والمطور يتجاوز الاختبارات الورقية التقليدية ليقيس الفهم العميق والمهارات عبر المشروعات والمهام الأدائية والملاحظة.",
                backStep: 6
            }
        };

        let currentStepIndex = 0;

        function renderSimulation() {
            const container = document.getElementById('simContent');
            const progressFill = document.getElementById('progressFill');
            const stepIndicator = document.getElementById('stepIndicator');
            
            const step = simulationData[currentStepIndex];
            
            progressFill.style.width = step.progress;
            stepIndicator.textContent = step.stepText;

            let html = `
                <div class="scenario-box">
                    <strong>📋 سيناريو المحاكاة:</strong><br>${step.scenario}
                </div>
                <div class="question-title">${step.question}</div>
                <div class="options-group">
            `;

            step.options.forEach((opt) => {
                html += `<button class="option-btn" onclick="handleAnswer(${opt.correct}, ${opt.next ? (typeof opt.next === 'string' ? `'${opt.next}'` : opt.next) : 'null'}, '${opt.remedialId || ''}')">${opt.text}</button>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function handleAnswer(isCorrect, nextStep, remedialId) {
            if (isCorrect) {
                if (nextStep === 'finish') {
                    showCompletionScreen();
                } else {
                    currentStepIndex = nextStep - 1;
                    renderSimulation();
                }
            } else {
                showRemedialScreen(remedialId);
            }
        }

        function showRemedialScreen(remId) {
            const container = document.getElementById('simContent');
            const rem = remedialContent[remId];

            container.innerHTML = `
                <div class="remedial-box">
                    <h3>${rem.title}</h3>
                    <p>${rem.text}</p>
                    <button class="action-btn" onclick="retryStep(${rem.backStep})">فهمت، العودة للمحاولة مجدداً 🔄</button>
                </div>
            `;
        }

        function retryStep(stepNum) {
            currentStepIndex = stepNum - 1;
            renderSimulation();
        }

        function showCompletionScreen() {
            const container = document.getElementById('simContent');
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('stepIndicator').textContent = 'اكتملت المحاكاة بنجاح 🎉';

            container.innerHTML = `
                <div class="remedial-box" style="border-color: #38a169; background: #f0fff4;">
                    <h3 style="color: #276749;">🎉 أتممتِ المحاكاة بامتياز تام!</h3>
                    <p style="text-align: center;">لقد غطيتِ كافة محاور المحاضرة (مفهوم التطوير، الأسس الستة، والتقنية، والتقويم) واجتزتِ المسارات العلاجية بنجاح تؤهلكِ لامتياز التكليف.</p>
                    <button class="action-btn" style="background: #38a169;" onclick="restartSim()">إعادة المحاكاة من البداية 🔄</button>
                </div>
            `;
        }

        function restartSim() {
            currentStepIndex = 0;
            renderSimulation();
        }

        window.onload = renderSimulation;
    </script>
</body>
</html>
